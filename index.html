<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca Inteligente - FIX</title>
<style>
body{font-family:system-ui;max-width:600px;margin:40px auto;padding:20px;text-align:center}
input{width:70%;padding:12px;border-radius:12px;border:1px solid #ccc}
button{padding:12px 20px;border-radius:12px;border:none;background:#000;color:#fff;font-weight:600;cursor:pointer;margin-left:8px}
.card{text-align:left;border:1px solid #eee;border-radius:12px;padding:12px;margin-top:12px}
.small{color:#888;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<h1>🛒 Busca Inteligente</h1>
<p>Digite como você fala: "algo pra lavar louça", "quero fazer dieta"</p>
<div>
<input id="q" placeholder="lavar as mãos" value="lavar as mãos" onkeydown="if(event.key==='Enter') buscar()">
<button onclick="buscar()">Buscar</button>
</div>
<div id="status" class="small"></div>
<div id="resultados"></div>
<div class="small">API: <span id="apiLabel"></span> - usando /buscar_publica (sem login)</div>

<script>
const API = "https://busca-inteligente-vetorial.onrender.com";
document.getElementById('apiLabel').textContent=API;

async function buscar(){
 const q = document.getElementById('q').value.trim();
 if(!q) return;
 document.getElementById('status').textContent='Buscando...';
 document.getElementById('resultados').innerHTML='';
 try{
  // USA ENDPOINT PUBLICO AGORA
  const r = await fetch(API+'/buscar_publica?q='+encodeURIComponent(q));
  const j = await r.json();
  if(!r.ok) throw new Error(JSON.stringify(j));
  document.getElementById('status').textContent=j.resultados.length+' resultados em '+j.tempo_ms+'ms';
  document.getElementById('resultados').innerHTML = j.resultados.map(p=>`<div class=card><b>${p.nome}</b><br>${p.descricao||''}<br>R$ ${p.preco||'-'} <span style="float:right">score ${p.score}</span></div>`).join('') || '<div class=card>Nenhum resultado</div>';
 }catch(e){
  document.getElementById('status').textContent='Erro: '+e.message;
 }
}
buscar();
</script>
</body>
</html>
