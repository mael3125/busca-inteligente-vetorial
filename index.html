<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca Inteligente - Busca Vetorial</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#fafafa; min-height:100vh; }
.container { max-width: 640px; margin: 0 auto; padding: 40px 20px; }
h1 { font-size: 32px; font-weight: 800; display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.subtitle { color:#666; font-size:15px; margin-bottom:24px; }
.search-box { background:white; border-radius:16px; padding:8px; display:flex; gap:8px; box-shadow:0 2px 12px rgba(0,0,0,0.06); border:1px solid #eee; margin-bottom:24px; }
.search-box input { flex:1; border:none; outline:none; font-size:16px; padding:12px 16px; background:transparent; }
.search-box button { background:#111; color:white; border:none; border-radius:12px; padding:12px 22px; font-weight:600; cursor:pointer; transition:0.2s; }
.search-box button:hover { background:#000; transform:scale(1.02); }
.search-box button:disabled { opacity:0.5; cursor:not-allowed; }
.card { background:white; border-radius:16px; padding:16px 18px; margin-bottom:12px; border:1px solid #eee; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; animation: slide 0.3s ease; }
@keyframes slide { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:translateY(0);} }
.card-info h3 { font-size:15px; font-weight:700; margin-bottom:4px; }
.card-info p { font-size:13px; color:#666; line-height:1.4; }
.badge { background:#e6f4ea; color:#137333; font-size:12px; font-weight:700; padding:6px 10px; border-radius:20px; white-space:nowrap; }
.empty { text-align:center; padding:40px 20px; color:#999; }
.empty span { font-size:40px; display:block; margin-bottom:12px; }
.examples { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
.examples button { background:white; border:1px solid #e5e5e5; padding:6px 12px; border-radius:20px; font-size:13px; cursor:pointer; }
.examples button:hover { border-color:#111; }
.footer { margin-top:40px; text-align:center; font-size:12px; color:#aaa; }
.footer a { color:#111; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="container">
  <h1>🛒 Busca Inteligente</h1>
  <p class="subtitle">Digite como você fala: "algo pra lavar louça", "quero fazer dieta", "limpeza"</p>

  <div class="search-box">
    <input id="q" placeholder="Ex: algo para cozinhar..." onkeydown="if(event.key==='Enter') buscar()">
    <button id="btn" onclick="buscar()">Buscar</button>
  </div>

  <div class="examples">
    <button onclick="setEx('algo para cozinhar')">algo para cozinhar</button>
    <button onclick="setEx('limpeza')">limpeza</button>
    <button onclick="setEx('lavar as mãos')">lavar as mãos</button>
    <button onclick="setEx('quero fazer dieta')">quero fazer dieta</button>
    <button onclick="setEx('internet')">internet</button>
  </div>

  <div id="resultados"></div>

  <div class="footer">
    Feito com pgvector + FastAPI + intfloat/multilingual-e5-small<br>
    <a href="https://github.com/mael3125/busca-inteligente-vetorial" target="_blank">Ver no GitHub</a> • Busca vetorial 100% semântica
  </div>
</div>

<script>
// URL da API no Render - NÃO pode ter barra no final e nem /buscar duplicado depois
const API_URL = "https://busca-inteligente-vetorial.onrender.com";

const input = document.getElementById('q');
const btn = document.getElementById('btn');
const resDiv = document.getElementById('resultados');

function setEx(txt) {
  input.value = txt;
  buscar();
}

async function buscar() {
  const q = input.value.trim();
  if (!q) return;
  
  btn.disabled = true;
  btn.textContent = '...';
  resDiv.innerHTML = '<div class="empty">🔍 Buscando...<br><small>Se for a 1ª vez, o Render demora 50s pra acordar</small></div>';

  try {
    const resp = await fetch(`${API_URL}/buscar?q=${encodeURIComponent(q)}`);
    if (!resp.ok) {
      const txt = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${txt.slice(0,200)}`);
    }
    const data = await resp.json();
    
    if (data.erro) {
      resDiv.innerHTML = `<div class="empty"><span>⚠️</span>Erro na API: ${data.erro}<br><small>${data.detalhe || ''}</small></div>`;
      return;
    }

    if (!data.resultados || data.resultados.length === 0) {
      resDiv.innerHTML = `<div class="empty"><span>🤷‍♂️</span>Nada encontrado para "<b>${q}</b>"<br><small style="color:#aaa">Tente: "algo para cozinhar", "limpeza", "lavar as mãos"</small></div>`;
      return;
    }

    resDiv.innerHTML = data.resultados.map(r => `
      <div class="card">
        <div class="card-info">
          <h3>${r.nome}</h3>
          <p>${r.descricao || ''} ${r.preco ? ' - R$ '+r.preco : ''}</p>
        </div>
        <div class="badge">${Math.round(r.score*100)}% match</div>
      </div>
    `).join('');

  } catch (e) {
    console.error(e);
    resDiv.innerHTML = `<div class="empty"><span>⚠️</span>API offline: ${e.message}<br><small>API: ${API_URL}/buscar?q=${q}</small><br><br><button onclick="buscar()" style="padding:8px 16px; border-radius:8px; border:1px solid #ddd; cursor:pointer;">Tentar novamente</button></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Buscar';
  }
}

// Busca inicial
window.onload = () => {
  input.value = 'limpeza';
  buscar();
}
</script>
</body>
</html>
